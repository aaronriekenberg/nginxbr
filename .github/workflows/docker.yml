name: Build and push nginx-brotli

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"   # daily, builds only if the nginx base image changed
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/nginx-brotli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether nginx base image changed
        id: check
        run: |
          digest=$(docker buildx imagetools inspect nginx:mainline --format '{{.Manifest.Digest}}')
          short=$(echo "${digest#sha256:}" | cut -c1-12)
          docker pull nginx:mainline
          v=$(docker run --rm nginx:mainline sh -c 'echo $NGINX_VERSION')
          echo "nginx=$v" >> "$GITHUB_OUTPUT"
          echo "basetag=base-$short" >> "$GITHUB_OUTPUT"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ] && \
             docker buildx imagetools inspect "$IMAGE:base-$short" >/dev/null 2>&1; then
            echo "Base image unchanged ($digest); skipping build."
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.check.outputs.nginx }}
            ${{ env.IMAGE }}:${{ steps.check.outputs.basetag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
