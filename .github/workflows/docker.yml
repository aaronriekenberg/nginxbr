name: Build and push nginx-brotli

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"   # daily, to pick up new nginx mainline releases
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-brotli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Pull latest nginx mainline and get version
        id: ver
        run: |
          docker pull nginx:mainline
          v=$(docker run --rm nginx:mainline sh -c 'echo $NGINX_VERSION')
          echo "nginx=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.nginx }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
